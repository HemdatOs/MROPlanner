<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוג שינויים - MRO Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/changelog.css">
</head>
<body>

<main class="container page-shell">
    <header class="form-header">
        <div>
            <div class="brand-row">
                <img src="../images/MROplannerLogo.png" alt="MRO Planner">
                <span>MRO Planner</span>
            </div>
            <h1>לוג שינויים</h1>
            <p class="subtitle">כל השינויים שבוצעו בתקלות של ביקור נתון - זמין להנהלה, ראש צוות, IT וביקורת איכות בלבד</p>
        </div>
        <div class="header-actions">
            <a href="homePage.html" class="btn-home">⇦ לדף הבית</a>
        </div>
    </header>

    <div class="page-body">
        <section class="form-section" style="padding-top:1.75rem;">
            <div class="form-group" style="max-width:420px;">
                <label for="visitSelect">ביקור</label>
                <select id="visitSelect">
                    <option value="">-- בחר ביקור --</option>
                </select>
            </div>
        </section>

        <section class="table-container" style="margin-top:1.75rem;">
            <table id="logTable">
                <thead>
                    <tr>
                        <th>תאריך ושעה</th>
                        <th>מס' תקלה</th>
                        <th>כותרת תקלה</th>
                        <th>בוצע ע"י</th>
                        <th>סוג שינוי</th>
                        <th>מ-</th>
                        <th>ל-</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr><td colspan="7" class="placeholder-text" style="text-align:center;">בחרי ביקור כדי לראות את הלוג</td></tr>
                </tbody>
            </table>
        </section>
    </div>
</main>

<script src="../js/authGuard.js"></script>
<script src="../js/changelog.js"></script>
</body>
</html>
